name: stats

# The Skills table is measured, not written. This job re-measures the public
# repositories once a week and commits the new snapshot, which triggers the
# normal deploy. Nothing here needs a secret: the repository list comes from
# the public GitHub API, and only public non-fork repositories are returned,
# so a repository that turns private drops out on the next run by itself.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Measure every public repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/measure-languages.mjs
          --from-api Terminalkid09
          --workdir "$RUNNER_TEMP/repos"

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- src/data/languages.json; then
            echo "No change in the measurement."
            exit 0
          fi
          git config user.name "Terminalkid09"
          git config user.email "Terminalkid09@gmail.com"
          git add src/data/languages.json
          git commit -m "Refresh the language split from the weekly measurement"
          git push
